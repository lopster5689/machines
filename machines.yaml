# Machine inventory - single source of truth.
# Edit this file, then run `make sync` to regenerate ~/.ssh/config.d/machines.
#
# status:  active   -> emitted to ssh config
#          offline  -> emitted (machine is real, just down / off-network)
#          dead     -> recorded only, NOT emitted (kept so we remember it existed)
#
# Paths in `key:` are relative to this directory unless they start with ~ or /.

defaults:
  user: root
  options:
    ControlMaster: auto
    ControlPath: ~/.ssh/cm-%r@%h:%p
    ControlPersist: 30m
    ServerAliveInterval: "30"
    ServerAliveCountMax: "3"

